# AETHENTRA ML-02 data sources. Credentials are NEVER stored here: the CDS client reads %USERPROFILE%\.cdsapirc
# (or CDSAPI_URL / CDSAPI_KEY environment variables).
primary: ncep_r1         # era5 | ncep_r1. INTERIM: set to era5 once ERA5 is downloaded and its cube built

era5:
  id: era5_daily_statistics
  name: ERA5 post-processed daily statistics on single levels from 1940 to present
  doi: https://doi.org/10.24381/cds.4991cf48
  landing_page: https://cds.climate.copernicus.eu/datasets/derived-era5-single-levels-daily-statistics
  citation: Hersbach et al. (2020) QJRMS 146:1999-2049; Copernicus Climate Change Service (C3S) Climate Data Store
  licence: Licence to use Copernicus products (accepted on the CDS website by the user)
  access: CDS API (cdsapi), free registration
  dataset_single: derived-era5-single-levels-daily-statistics
  dataset_pressure: derived-era5-pressure-levels-daily-statistics
  dataset_invariant: reanalysis-era5-single-levels
  area: [-55, -180, -90, 180]          # N, W, S, E  (5 deg halo north of the 60 S model domain)
  daily_statistic: daily_mean
  frequency: 1_hourly                  # daily mean of the 24 hourly values (UTC day)
  time_zone: utc+00:00
  years: [1979, 2026]                 # current year = partial: complete months only, provenance complete_year: false (refreshed)
  # Priority order = download order. Target first so baselines can run as soon as it is complete.
  single_levels:
    t2m: {cds: 2m_temperature, units: K, range: [170, 320]}
    msl: {cds: mean_sea_level_pressure, units: Pa, range: [85000, 110000]}
    u10: {cds: 10m_u_component_of_wind, units: m s-1, range: [-60, 60]}
    v10: {cds: 10m_v_component_of_wind, units: m s-1, range: [-60, 60]}
    d2m: {cds: 2m_dewpoint_temperature, units: K, range: [160, 310]}
    tcc: {cds: total_cloud_cover, units: "(0 - 1)", range: [0, 1]}
    tp: {cds: total_precipitation, units: m, range: [0, 0.05]}   # for ML-04 (daily mean of hourly accumulations); not an ML-02 input
  pressure_levels:
    z500: {cds: geopotential, level: 500, units: m2 s-2, range: [40000, 60000]}
    t850: {cds: temperature, level: 850, units: K, range: [200, 300]}
  invariants:
    lsm: {cds: land_sea_mask, units: "(0 - 1)"}
    z: {cds: geopotential, units: m2 s-2}
  local_dir: data/raw/era5

ncep_interim:
  id: ncep_ncar_r1_daily_2m
  name: NCEP/NCAR Reanalysis 1 daily mean 2 m air temperature (T62 Gaussian grid) - INTERIM, not ERA5
  doi: https://doi.org/10.1175/1520-0477(1996)077<0437:TNYRP>2.0.CO;2
  landing_page: https://psl.noaa.gov/data/gridded/data.ncep.reanalysis.html
  access: public OPeNDAP (NOAA PSL THREDDS), no login
  opendap_base: https://psl.noaa.gov/thredds/dodsC/Datasets/ncep.reanalysis/Dailies/
  variables:
    air: {path: "surface_gauss/air.2m.gauss.{year}.nc", units: K, description: 2 m air temperature}
  lat_max: -50.0
  years: [1979, 2026]
  local_dir: data/raw/ncep_r1_2m

stations:
  zenodo:
    id: turner_staffed_stations_daily
    name: Daily Temperature and Temperature Anomaly Data at Staffed Antarctic Stations
    record: 17164992
    api: https://zenodo.org/api/records/17164992
    licence: CC-BY-4.0
    reference: Turner, J. et al. (2020) Antarctic temperature variability and change from station data. Int. J. Climatol. 40
    local_dir: data/raw/station_observations/zenodo_17164992
  ghcnd:
    id: noaa_ghcn_daily_antarctic
    name: NOAA Global Historical Climatology Network - Daily (Antarctic stations)
    doi: https://doi.org/10.7289/V5D21VHZ
    stations_url: https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-stations.txt
    inventory_url: https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-inventory.txt
    station_csv_url: https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/{id}.csv
    lat_max: -60.0
    require_tavg_years: [1990, 2020]
    local_dir: data/raw/station_observations/ghcnd
