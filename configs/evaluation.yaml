sic_threshold: 15                     # % ; extent / ice-edge classification: SIC >= 15 %
ice_edge_band_cells: 3                # cells within 3 grid cells (~75 km) of the observed 15 % edge
regions:
  full_ocean: all valid ocean cells with a valid target
  seasonal_ice_zone: ocean cells whose TRAINING climatology reaches >= 15 % on some day of year
seasons:                              # austral seasons by target-window midpoint month
  DJF: [12, 1, 2]
  MAM: [3, 4, 5]
  JJA: [6, 7, 8]
  SON: [9, 10, 11]
conditions:                           # by observed target SIC
  open_water: [0, 15]
  marginal_ice: [15, 80]
  pack_ice: [80, 100.01]
quantiles: [0.1, 0.9]                 # 80 % prediction interval (only reported if coverage verified)
